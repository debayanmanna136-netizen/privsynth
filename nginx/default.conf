# =============================================================================
# PrivSynth - Production Nginx Reverse Proxy Configuration
# =============================================================================

upstream backend_service {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Allow 50 MB upload payload plus 10 MB overhead for multipart boundaries
    client_max_body_size 60M;

    # Static frontend root
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for static assets and text responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;

    # Frontend single-page application and static assets
    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets caching
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Reverse proxy for backend FastAPI endpoints
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        # Preserve client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts to accommodate CTGAN model training (up to 300s)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Streaming upload and download configuration
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

